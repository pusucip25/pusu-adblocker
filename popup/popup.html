<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusu AdBlocker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      user-select: none;
    }
    .header {
      background: linear-gradient(135deg, #16213e, #0f3460);
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #0f3460;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #e94560;
      letter-spacing: 0.5px;
    }
    .header .shield { font-size: 24px; margin-bottom: 2px; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 14px;
    }
    .stat-card {
      background: #16213e;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      border: 1px solid #0f3460;
    }
    .stat-card .number {
      font-size: 24px;
      font-weight: 800;
      color: #e94560;
      line-height: 1;
    }
    .stat-card .label {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .block-btn {
      display: block;
      width: calc(100% - 28px);
      margin: 8px 14px;
      padding: 10px;
      background: linear-gradient(135deg, #e94560, #c23152);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }
    .block-btn:hover {
      background: linear-gradient(135deg, #ff5a7a, #e94560);
      transform: scale(1.02);
    }
    .block-btn:active {
      transform: scale(0.97);
    }
    .block-btn.blocked {
      background: #0f3460;
      color: #888;
      cursor: default;
    }
    .block-btn.blocked:hover {
      transform: none;
    }
    .site-info {
      padding: 8px 14px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }
    .site-info .domain {
      color: #ccc;
      font-weight: 600;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #16213e;
      margin: 4px 14px;
      border-radius: 8px;
      border: 1px solid #0f3460;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00c853;
      box-shadow: 0 0 8px #00c85366;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .status-dot.off { background: #666; box-shadow: none; }
    .status-text { font-size: 13px; font-weight: 600; }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #333;
      border-radius: 24px;
      transition: 0.3s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider { background: #e94560; }
    input:checked + .slider:before { transform: translateX(20px); }
    .toast {
      margin: 4px 14px;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      background: #0f3460;
      color: #00c853;
      display: none;
    }
    .toast.show { display: block; }
    .toast.info { color: #ffa500; }
    .footer {
      padding: 8px 14px;
      text-align: center;
      font-size: 10px;
      color: #444;
      border-top: 1px solid #0f3460;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="shield">🛡️</div>
    <h1>Pusu AdBlocker</h1>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="number" id="blockedTotal">0</div>
      <div class="label">Total Blocate</div>
    </div>
    <div class="stat-card">
      <div class="number" id="blockedDynamic">0</div>
      <div class="label">Blocate de Tine</div>
    </div>
  </div>

  <div class="site-info">
    📄 <span class="domain" id="currentDomain">—</span>
  </div>

  <button class="block-btn" id="blockBtn">
    🚫 Blochează site-ul asta
  </button>
  <div class="toast" id="toast"></div>

  <div class="status-bar">
    <div style="display:flex;align-items:center;">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Activ</span>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="toggleBtn" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">v1.6 · Zero tracking · Open source</div>

  <script src="popup.js"></script>
</body>
</html>
